# Cấu hình driver cho cánh tay MỚI — thiết kế cuối newarm_final (4 servo,
# bút gắn cứng đồng trục J4, không có wrist_pitch / gripper).
# Dùng: ros2 launch wicom_roboarm wicom_roboarm.launch.py servo_config:=servos_newarm.yaml
# Hình học + ánh xạ độ<->rad: ros2_ws/src/visual_servoing/scripts/rl/fk_newarm.py
# (SERVO_SPECS ở đó phải khớp với neutral/limits/đảo chiều ở đây).
wicom_roboarm_unified:
  ros__parameters:
    # ── I2C / PCA9685 ──
    i2c_bus: 1
    i2c_address: "0x40"
    pwm_frequency_hz: 50.0
    # TẦN SỐ DAO ĐỘNG THẬT của chip PCA9685. Danh nghĩa 25 MHz nhưng mỗi mạch
    # lệch vài % (thường chạy NHANH hơn) -> mọi xung ra bị co lại cùng tỉ lệ,
    # servo đứng lệch so với lúc đặt bằng ESP32 (ESP32 phát xung chuẩn).
    # Hiệu chỉnh 1 lần cho mỗi mạch:
    #   - đo tần số ở 1 chân PWM (đồng hồ thang Hz / máy hiện sóng):
    #         oscillator_hz = 25000000 * tần_số_đo / 50        (53 Hz -> 26500000)
    #   - hoặc đo độ rộng xung khi lệnh 90 (đúng phải 1500 us):
    #         oscillator_hz = 25000000 * 1500 / xung_đo_us     (1415 us -> 26500000)
    # Chưa đo thì để 25000000.
    oscillator_hz: 25000000
    use_mux: false

    # ── Behavior ──
    enable_on_start: false
    command_timeout_sec: 1.0
    timeout_behavior: "hold"
    shutdown_behavior: "off"

    # ── Global pulse defaults ──
    pulse_us_min: 500.0
    pulse_us_max: 2500.0
    period_us: 20000.0

    # ── Joint → Channel mapping ──
    # J1 Base       : TD-8120MG → CH0   (yaw, trục -Z)
    # J2 Shoulder   : RDS3120   → CH1   (pitch, trục -X)
    # J3 Elbow      : MG996R    → CH2   (pitch, trục -X)
    # J4 Wrist Roll : MG996R    → CH3   (xoay bút quanh trục cẳng tay)
    joint_names: ["base", "shoulder", "elbow", "wrist_roll"]
    channels:    [0, 1, 2, 3]

    # ── Per-joint pulse calibration (µs) ──
    # Driver map lệnh 0-180 TUYẾN TÍNH vào [min, max]. Đặt 500-2500 cho MỌI
    # servo để TRÙNG với sketch ESP32 dùng lúc đặt sừng (MIN_PULSE 500,
    # MAX_PULSE 2500): cùng một số "độ" cho cùng một độ rộng xung.
    # MG996R có thể kêu/kẹt ở sát 0 hoặc 180 — tránh hai đầu hành trình
    # bằng limits_min/max bên dưới nếu cần, đừng đổi dải xung.
    pulse_us_min_by_joint: [500.0, 500.0, 500.0, 500.0]
    pulse_us_max_by_joint: [2500.0, 2500.0, 2500.0, 2500.0]

    # ── Neutral / Limits ──
    # neutral 90° = URDF q=0 = tay treo thẳng xuống (giả định — cần xác nhận).
    # Khuỷu: nếu lắp lệch sừng để có dải q3 [-30°,150°] thì q3=0 ứng lệnh 30°
    # -> sửa home_deg trong fk_newarm.SERVO_SPECS (neutral ở đây chỉ là tư thế nghỉ).
    neutral_deg: 90.0
    neutral_deg_by_joint: [90.0, 90.0, 90.0, 90.0]

    limits_min_deg_by_joint: [0.0, 0.0, 0.0, 0.0]
    limits_max_deg_by_joint: [180.0, 180.0, 180.0, 180.0]

    publish_rate_hz: 25.0
    trajectory_update_rate_hz: 50.0
    trajectory_profile: "min_jerk"
    default_moving_time_sec: 0.0
    command_deadband_deg: 0.0
